# valid fixture: HTTP 接口但故意不指明 auth.secret_env 来源
# 用于 validate_credentials=True 时验证 fail-fast
# 使用独特 vendor_id/interface_id 避免与其他 valid fixture 重复 FQN
vendor_spec:
  schema_version: "1.0"
  run_window_minutes: 30
  severity_policy: "default"
  interfaces:
    - vendor_id: missing-creds-vendor
      interface_id: token-required
      display_name: "需 token 接口（测试用）"
      protocol: http
      host: 127.0.0.1
      port: 80
      base_path: /api/v1
      timeout_seconds: 5
      auth:
        type: bearer
        secret_env: VENDOR_MISSING_TOKEN_FOR_TEST
      sample_endpoint:
        http:
          method: GET
          path: /register/slot
          headers: {}
          body: ""
      required_fields:
        - "$.code"
  inspection:
    fail_fast: false