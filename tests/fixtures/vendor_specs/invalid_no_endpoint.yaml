# 故意 sample_endpoint 缺 http 或 hl7v2 的 spec
vendor_spec:
  schema_version: "1.0"
  interfaces:
    - vendor_id: his
      interface_id: outpatient-register
      display_name: "HIS 门诊挂号接口"
      protocol: http
      host: his.local
      port: 80
      auth:
        type: bearer
        secret_env: VENDOR_HIS_TOKEN
      sample_endpoint: {}            # 空对象
      required_fields:
        - "$.code"
